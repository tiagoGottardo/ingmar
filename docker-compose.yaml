services:
  pg:
    image: postgres:16-alpine
    container_name: ingmar-db
    network_mode: host
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ingmar
    volumes:
      - pg_data:/var/lib/postgresql/data 
      - ./apps/database/V1__Setup.sql:/docker-entrypoint-initdb.d/init.sql 

volumes:
  pg_data: {}
